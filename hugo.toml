baseURL = "https://wolfgang61.github.io/rl-digital-api-docs/"
title = "Electronic Product Leaflet API Documentation"

defaultContentLanguage = "en"

[languages]
  [languages.en]
    languageName = "English"
    weight = 1

enableRobotsTXT = true
enableGitInfo = true

[params]
  copyright = "PharmaProtect Solutions GmbH"
  github_repo = "https://github.com/Wolfgang61/rl-digital-api-docs"
  github_project_repo = "https://github.com/Wolfgang61/rl-digital-api-docs"
  robots = "noindex, nofollow"


  offlineSearch = true

  [params.ui]
    
    sidebar_menu_compact = true
    sidebar_search_disable = false
    breadcrumb_disable = false
    # Aktiviert Feedback-Buttons
    feedback = { enable = true, yes = "Yes, this page was helpful!", no = "No, this page needs improvement" }

[markup]
  [markup.goldmark.renderer]
    unsafe = true

  [markup.highlight]
    noClasses = false
    style = "github"
    lineNos = false

[outputs]
  home = ["HTML"]

[taxonomies]
  category = "categories"
  tag = "tags"

[module]
  [module.hugoVersion]
    extended = true
    min = "0.146.0"

  [[module.imports]]
    path = "github.com/google/docsy"