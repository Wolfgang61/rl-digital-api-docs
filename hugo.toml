baseURL = "https://wolfgang61.github.io/rl-digital-api-docs/"
title = "Electronic Product Leaflet API Documentation"

defaultContentLanguage = "en"

[languages]
  [languages.en]
    label = "English"
    weight = 1

enableRobotsTXT = true
enableGitInfo = true

[params]
  copyright = "Arvato Systems. All rights reserved."
  github_repo = "https://github.com/Wolfgang61/rl-digital-api-docs"
  github_project_repo = "https://github.com/Wolfgang61/rl-digital-api-docs"
  robots = "noindex, nofollow"


  offlineSearch = true

  [params.ui]
    
    sidebar_menu_compact = true
    sidebar_search_disable = false
    breadcrumb_disable = false

[params.ui.feedback]
  enable = false

[markup]
  [markup.goldmark.renderer]
    unsafe = true

  [markup.highlight]
    noClasses = false
    style = "github"
    lineNos = false

#[outputs]
#  home = ["HTML"]

[taxonomies]
  category = "categories"
  tag = "tags"

[module]
  [module.hugoVersion]
    extended = true
    min = "0.166.0"

  [[module.imports]]
    path = "github.com/docsy/docsy/theme"