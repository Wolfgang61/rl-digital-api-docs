name: CI and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show layouts
        run: |
          find layouts -type f | sort

      - name: Show content count
        run: |
          find content -name "*.md" | wc -l

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Install Python dependencies
        run: |
          python3 -m pip install -r scripts/requirements.txt

      - name: Verify Hugo modules
        run: |
          hugo mod verify

      - name: Install NPM dependencies
        run: |
          npm ci

      - name: Validate OpenAPI specs
        run: |
          npm run validate:openapi

      - name: Check content
        run: |
          npm run check:content

      - name: Show Hugo config
        run: |
          cat hugo.toml
      
      - name: Debug content
        run: |
          echo "===== CONTENT ====="
          find content -type f | sort

          echo "===== DOCS ====="
          find content -type f | sort || true

          echo "===== HUGO CONFIG ====="
          hugo config | grep -E "defaultContentLanguage|contentDir|theme"

      - name: Show Hugo Version
        run: |
          which hugo
          hugo version

      - name: Build website
        run: |
          hugo --gc --minify --panicOnWarning

      - name: Show generated output
        run: |
          echo "HTML FILES"
          find public -name "*.html" | sort

          echo "HTML COUNT"
          find public -name "*.html" | wc -l

          echo "ROOT"
          ls -la public

      - name: Show Hugo outputs
        run: |
          hugo config | grep -A20 outputs

      - name: Show loaded modules
        run: |
          hugo mod graph

      - name: Show generated files
        run: |
          find public -maxdepth 3 -type f | sort

      - name: Debug site
        run: |
          echo "===== INDEX ====="
          find public -name "index.html"

          echo "===== DOCS ====="
          find public -type f || true

          echo "===== ALL FILES ====="
          find public -type f | sort


      - name: Debug output
        run: |
          pwd
          ls -la
          ls -la public
          echo "==== HTML ===="
          find public -name "*.html" | sort
          echo "==== XML ===="
          find public -name "*.xml" | sort

      - name: Inspect public
        run: |
          echo "ROOT"
          ls -la public

          echo "APIS"
          ls -la public/apis || true

          echo "EAAPI"
          ls -la public/apis/eaapi || true

          echo "INDEX"
          if [ -f public/index.html ]; then
            echo "FOUND public/index.html"
          else
            echo "MISSING public/index.html"
          fi
      - name: Show full Hugo config
        run: |
          hugo config > hugo-config.txt
          cat hugo-config.txt

      - name: Show home page outputs
        run: |
          find public -maxdepth 2 -type f | sort


      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4