name: CI and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.167.0"
          extended: true

      - name: Install Python dependencies
        run: |
          python3 -m pip install -r scripts/requirements.txt

      - name: Verify Hugo modules
        run: |
          hugo mod verify

      - name: Sync Hugo npm metadata
        run: |
          hugo mod npm pack

      - name: Install NPM dependencies
        run: |
          npm ci

      - name: Add Dart Sass to PATH
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/sass-embedded-linux-x64/dart-sass" >> $GITHUB_PATH

      - name: Validate OpenAPI specs
        run: |
          npm run validate:openapi

      - name: Check content
        run: |
          npm run check:content

      - name: Build website
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo --gc

      - name: Verify generated site
        run: |
          test -f public/index.html
          test -f public/apis/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4